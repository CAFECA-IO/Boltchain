<style>
:root {
  /* Boltchain brand: deep navy, electric blue bolt, teal network mesh. Dark by default. */
  --bg: #0b0f17; --panel: #111823; --panel2: #0e141e; --text: #e7edf5; --muted: #8b9ab0; --line: #1e2938;
  --accent: #3b82e0; --accent2: #63b3ff; --accent-soft: rgba(59,130,224,.14); --teal: #6cc3bb;
  --ok: #4fc38a; --ok-soft: rgba(79,195,138,.13); --bad: #ff6b6b; --bad-soft: rgba(255,107,107,.13);
  --warn: #f0b64d; --warn-soft: rgba(240,182,77,.13); --link: #63b3ff; --code: #172131;
  --hdr: #0b0f17; --hdr-line: #1a2433; --shadow: none;
}
:root[data-theme="light"] {
  --bg: #f4f6fa; --panel: #ffffff; --panel2: #f8fafc; --text: #111827; --muted: #5f6b7d; --line: #e2e7ef;
  --accent: #2f6fcf; --accent2: #2f6fcf; --accent-soft: #e8f0fc; --teal: #2b8f86;
  --ok: #1f8a4c; --ok-soft: #e5f5ec; --bad: #c92a2a; --bad-soft: #fdecec; --warn: #a86b0c; --warn-soft: #fdf3e0;
  --link: #1f5fc4; --code: #eef2f7; --shadow: 0 1px 2px rgba(16,24,40,.06);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC",
    "Microsoft JhengHei", Roboto, sans-serif;
}
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
.muted { color: var(--muted); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
header.top { background: var(--hdr, #0b0f17); border-bottom: 1px solid var(--hdr-line, #1a2433); position: sticky; top: 0; z-index: 5; }
:root[data-theme="light"] header.top { --hdr: #0b0f17; --hdr-line: #0b0f17; }
.bar { display: flex; align-items: center; gap: 16px; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.brand img { height: 26px; width: auto; display: block; }
.brand small { font-weight: 600; color: #6cc3bb; font-size: 11px; border: 1px solid #24405a; border-radius: 999px; padding: 1px 8px; letter-spacing: .04em; }
.brand:hover { text-decoration: none; }
nav.links { display: flex; gap: 14px; }
nav.links a { color: #8b9ab0; font-weight: 500; }
nav.links a.on, nav.links a:hover { color: #ffffff; text-decoration: none; }
form.search { flex: 1; display: flex; min-width: 0; }
form.search input {
  flex: 1; min-width: 0; height: 38px; border: 1px solid #22303f; border-radius: 10px 0 0 10px;
  background: #0f1622; color: #e7edf5; padding: 0 12px; font-size: 14px; outline: none;
}
form.search button { height: 38px; border: 0; background: linear-gradient(135deg, #4d9bf0, #2f6fcf); color: #fff; border-radius: 0 10px 10px 0; padding: 0 14px; cursor: pointer; font-weight: 600; }
.tools { display: flex; gap: 6px; }
.tools button { height: 32px; min-width: 32px; border: 1px solid #22303f; background: #0f1622; color: #cfd8e3; border-radius: 8px; cursor: pointer; font-size: 13px; padding: 0 8px; }
main.wrap { padding: 24px 16px 48px; }
h1 { font-size: 20px; margin: 4px 0 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
h2 { font-size: 15px; margin: 0; }
.grid { display: grid; gap: 12px; }
.grid > * { min-width: 0; }
.stats { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.stat { padding: 14px 16px; }
.stat .k { color: var(--muted); font-size: 12px; text-transform: none; }
.stat .v { font-size: 20px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
.two { grid-template-columns: 1fr 1fr; }
@media (max-width: 860px) { .two { grid-template-columns: 1fr; } nav.links { display: none; } }
@media (max-width: 560px) { .brand small { display: none; } .bar { gap: 8px; } .brand img { height: 20px; } }
@media (max-width: 720px) { body.home form.search { visibility: hidden; } }
.card-h { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.list .row { display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--line); min-width: 0; }
.list .row:last-child { border-bottom: 0; }
.row .ic { flex: none; width: 36px; height: 36px; border-radius: 9px; background: var(--code); display: grid; place-items: center; font-size: 12px; color: var(--muted); font-weight: 600; }
.row .main { flex: 1; min-width: 0; }
.row .main div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .side { text-align: right; flex: none; }
.badge { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 9px; background: var(--code); color: var(--muted); white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.acc { background: var(--accent-soft); color: var(--accent); }
table.kv { width: 100%; border-collapse: collapse; }
table.kv td { padding: 11px 16px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.kv tr:last-child td { border-bottom: 0; }
table.kv td:first-child { width: 220px; color: var(--muted); }
@media (max-width: 700px) { table.kv td { display: block; width: auto !important; } table.kv td:first-child { padding-bottom: 0; border-bottom: 0; } }
.break { word-break: break-all; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
table.tbl th, table.tbl td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.tbl th { color: var(--muted); font-weight: 600; font-size: 12px; background: var(--bg); }
table.tbl td.r, table.tbl th.r { text-align: right; }
.scroll { overflow-x: auto; }
.pager { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.btn.acc { background: linear-gradient(135deg, #4d9bf0, #2f6fcf); border-color: transparent; color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.copy { cursor: pointer; color: var(--muted); margin-left: 6px; font-size: 12px; border: 0; background: none; }
.phase { padding: 16px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
@media (max-width: 700px) { .steps { grid-template-columns: 1fr; } }
.step { border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.step.cur { border-color: var(--accent); background: var(--accent-soft); }
.step.done { opacity: .75; }
.step h3 { margin: 0 0 4px; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
.step p { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
.meter { margin: 6px 0; font-size: 12px; }
.meter .t { display: flex; justify-content: space-between; color: var(--muted); }
.meter .b { height: 6px; background: var(--code); border-radius: 999px; overflow: hidden; margin-top: 3px; }
.meter .b i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--teal)); border-radius: 999px; }
.meter.full .b i { background: var(--ok); }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.err { padding: 16px; border-radius: 12px; background: var(--bad-soft); color: var(--bad); }
.note { padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 13px; margin-bottom: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.verify-out { margin-top: 8px; font-size: 13px; }
footer.wrap { color: var(--muted); font-size: 12px; padding: 20px 16px 32px; border-top: 1px solid var(--line); }
.spark { width: 100%; height: 44px; display: block; }
.tabs { display: flex; gap: 4px; margin-bottom: 12px; }
.hero { position: relative; overflow: hidden; border-radius: 16px; margin-bottom: 16px; padding: 36px 28px 30px;
  background: radial-gradient(1200px 400px at 80% 0%, #13253a 0%, #0b0f17 60%); border: 1px solid #1a2433; color: #e7edf5; }
.hero svg.mesh { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .55; pointer-events: none; }
.hero .in { position: relative; max-width: 720px; }
.hero h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: .02em; }
.hero p { margin: 0 0 18px; color: #9fb0c6; }
.hero form { display: flex; }
.hero input { flex: 1; min-width: 0; height: 46px; border: 1px solid #27405a; border-radius: 12px 0 0 12px; background: rgba(11,15,23,.85); color: #e7edf5; padding: 0 14px; font-size: 15px; outline: none; }
.hero button { height: 46px; border: 0; background: linear-gradient(135deg, #4d9bf0, #2f6fcf); color: #fff; padding: 0 22px; border-radius: 0 12px 12px 0; font-weight: 700; cursor: pointer; }
.vform { padding: 16px; display: grid; gap: 14px; }
.vform label.f { display: grid; gap: 4px; font-size: 13px; }
.vform label.f > span { color: var(--muted); }
.vform input[type=text], .vform textarea, .vform select { width: 100%; border: 1px solid var(--line); background: var(--panel2); color: var(--text); border-radius: 8px; padding: 8px 10px; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.vform textarea { min-height: 64px; resize: vertical; }
.drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop input[type=file] { display: none; }
.drop .nm { min-width: 0; overflow-wrap: anywhere; font-size: 13px; }
.hint { font-size: 12px; color: var(--muted); }
.radios { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 700px) { .cols2 { grid-template-columns: 1fr; } }
.verdict { display: flex; gap: 14px; align-items: center; padding: 18px 16px; border-bottom: 1px solid var(--line); }
.verdict .big { font-size: 22px; font-weight: 700; }
.verdict.ok .big { color: var(--ok); } .verdict.bad .big { color: var(--bad); } .verdict.warn .big { color: var(--warn); }
.checks .row { align-items: flex-start; }
.checks .ic.ok { color: var(--ok); background: var(--ok-soft); } .checks .ic.bad { color: var(--bad); background: var(--bad-soft); } .checks .ic.warn { color: var(--warn); background: var(--warn-soft); }
.checks .main div { white-space: normal !important; overflow-wrap: anywhere; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 16px; }
.print-only { display: none; }
.cv-hero { padding: 26px 22px; margin-bottom: 16px; }
.cv-hero h1 { margin: 0 0 6px; }
.cv-hero p { margin: 0; color: var(--muted); max-width: 760px; }
.cv-find { display: flex; gap: 8px; }
.cv-find input { flex: 1; min-width: 0; height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel2); color: var(--text); padding: 0 14px; font: 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .06em; text-transform: uppercase; }
.cv-find input::placeholder { text-transform: none; letter-spacing: 0; font-size: 14px; }
.cv-find button { height: 44px; padding: 0 18px; }
.cv-body { padding: 16px; display: grid; gap: 12px; }
.bigdrop { border: 2px dashed var(--line); border-radius: 14px; padding: 26px 16px; text-align: center; color: var(--muted); cursor: pointer; }
.bigdrop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
.bigdrop input { display: none; }
.bigdrop b { color: var(--link); font-weight: 600; }
.flist { display: grid; gap: 4px; font-size: 13px; }
.flist .f { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 6px 10px; border-radius: 8px; background: var(--panel2); min-width: 0; }
.flist .f span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.flist .f button { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; }
.switch { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; cursor: pointer; }
.switch .tg { position: relative; flex: none; width: 46px; height: 26px; margin-top: 1px; }
.switch .tg input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; z-index: 1; }
.switch .tg i { position: absolute; inset: 0; border-radius: 999px; background: #3a4a60; border: 1px solid #4a5b73; transition: background .2s, border-color .2s; }
:root[data-theme="light"] .switch .tg input:not(:checked) + i { background: #cbd3de; border-color: #b8c2d0; }
.switch .tg i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35); transition: transform .2s; }
.switch .tg input:checked + i { background: linear-gradient(135deg, #4d9bf0, #2f6fcf); border-color: transparent; }
.switch .tg input:checked + i::after { transform: translateX(20px); }
.switch .tg input:focus-visible + i { outline: 2px solid var(--accent2); outline-offset: 2px; }
.switch .tg input:disabled + i { opacity: .5; }
@media (prefers-reduced-motion: reduce) { .switch .tg i, .switch .tg i::after { transition: none; } }
.btn.lg { height: 46px; font-size: 15px; font-weight: 650; padding: 0 20px; border-radius: 10px; }
.cv-status { font-size: 13px; color: var(--muted); min-height: 18px; overflow-wrap: anywhere; }
.cert { position: relative; padding: 28px 28px 22px; overflow: hidden; }
.cert::before { content: ""; position: absolute; inset: 8px; border: 1px solid var(--line); border-radius: 8px; pointer-events: none; }
.cert-top { display: flex; gap: 20px; align-items: center; justify-content: space-between; flex-wrap: wrap; position: relative; }
.cert-top h1 { margin: 0; font-size: 24px; letter-spacing: .04em; }
.cert-top .sub { color: var(--muted); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
.cert-code { font: 600 26px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .08em; margin: 14px 0 4px; overflow-wrap: anywhere; }
.seal { width: 150px; height: 150px; flex: none; }
.cert table.kv { table-layout: fixed; }
.cert table.kv td { overflow-wrap: anywhere; }
.cert table.kv td:first-child { width: 150px; }
.cert-state { display: inline-flex; gap: 6px; align-items: center; font-weight: 650; }
.match { display: grid; gap: 4px; margin-top: 8px; font-size: 13px; }
.match .row { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-radius: 8px; background: var(--panel2); min-width: 0; }
.match .row span.n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
@media (max-width: 560px) { .cert { padding: 20px 16px; } .seal { width: 110px; height: 110px; } .cert-code { font-size: 19px; } }
@media print { .cert { border: 2px solid #999; } .bigdrop, .cv-find { display: none !important; } }
#vres table.kv { table-layout: fixed; }
#vres table.kv td { overflow-wrap: anywhere; word-break: break-word; }
@media print {
  :root, :root[data-theme="light"] { --bg: #fff; --panel: #fff; --panel2: #fff; --text: #000; --muted: #444; --line: #bbb; --code: #f2f2f2; --ok: #0a6b35; --bad: #b00020; --warn: #8a5a00; --ok-soft: #fff; --bad-soft: #fff; --warn-soft: #fff; --link: #000; }
  header.top, footer.wrap, .no-print, .actions, .tabs { display: none !important; }
  .print-only { display: block; }
  main.wrap { padding: 0; max-width: none; }
  .card { border: 1px solid #bbb; break-inside: avoid; }
  body { font-size: 12px; }
}
</style>

const $app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
async function api(path) {
  const r = await fetch("/api/" + path, { cache: "no-store" });
  const j = await r.json().catch(() => ({ error: r.statusText }));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const WEI = 10n ** 18n;
function bolt(w, digits = 4) {
  if (w === null || w === undefined) return "—";
  const v = BigInt(w);
  const neg = v < 0n; const a = neg ? -v : v;
  const i = a / WEI; const f = a % WEI;
  let fs = f.toString().padStart(18, "0").slice(0, digits).replace(/0+$/, "");
  const is = i.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (neg ? "-" : "") + is + (fs ? "." + fs : "") + " BOLT";
}
function gwei(w) {
  const v = Number(BigInt(w)) / 1e9;
  return (v < 0.01 ? v.toPrecision(3) : v.toFixed(v < 10 ? 3 : 1)) + " Gwei";
}
const num = (n) => Number(n).toLocaleString(lang === "zh" ? "zh-TW" : "en-US");
function ago(ts) {
  const s = Math.max(0, Math.floor(Date.now() / 1000 - ts));
  if (s < 60) return s + " " + t("s") + " " + t("ago");
  if (s < 3600) return Math.floor(s / 60) + " " + t("m") + " " + t("ago");
  if (s < 86400) return Math.floor(s / 3600) + " " + t("h") + " " + t("ago");
  return Math.floor(s / 86400) + " " + t("d") + " " + t("ago");
}
const dateOf = (ts) => new Date(ts * 1000).toLocaleString(lang === "zh" ? "zh-TW" : "en-US");
const short = (h, a = 8, b = 6) => (h && h.length > a + b + 2 ? h.slice(0, a) + "…" + h.slice(-b) : h || "");
function hashrate(h) {
  const u = ["H/s", "kH/s", "MH/s", "GH/s"]; let i = 0;
  while (h >= 1000 && i < u.length - 1) { h /= 1000; i++; }
  return h.toFixed(h < 10 ? 2 : 1) + " " + u[i];
}
const aLink = (a, label) => a ? `<a class="mono" href="/address/${a}">${esc(label || short(a, 10, 8))}</a>` : "—";
const bLink = (n) => `<a href="/block/${n}">${num(n)}</a>`;
const txLink = (h, full) => `<a class="mono" href="/tx/${h}">${esc(full ? h : short(h, 10, 8))}</a>`;
const copyBtn = (v) => `<button class="copy" data-copy="${esc(v)}" title="${t("copy")}">⧉</button>`;
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-copy]");
  if (!b) return;
  const done = () => { b.textContent = "✓"; setTimeout(() => (b.textContent = "⧉"), 1200); };
  try { navigator.clipboard.writeText(b.dataset.copy).then(done, done); } catch (_) { done(); }
});
const statusBadge = (s) => ({ active: `<span class="badge ok">${t("st.active")}</span>`, exiting: `<span class="badge warn">${t("st.exiting")}</span>`, slashed: `<span class="badge bad">${t("st.slashed")}</span>`, withdrawn: `<span class="badge">${t("st.withdrawn")}</span>` }[s] || `<span class="badge">${esc(s)}</span>`);
const auditTarget = (a) => a.kind === "deal" ? `${t("e.deal")} ${a.target}` : `${t("epoch")} <a href="/epoch/${a.target}">${a.target}</a>`;
const auditBlock = (a) => a.kind === "deal" ? `#${a.height}` : bLink(a.height);
const auditBadge = (s) => ({ passed: `<span class="badge ok">${t("au.passed")}</span>`, failed: `<span class="badge bad">${t("au.failed")}</span>`, pending: `<span class="badge warn">${t("au.pending")}</span>` }[s] || esc(s));
const txStatus = (tx) => tx.pending ? `<span class="badge warn">${t("pending")}</span>` : tx.success === false ? `<span class="badge bad">${t("fail")}</span>` : tx.success === true ? `<span class="badge ok">${t("ok")}</span>` : "";
const kv = (rows) => `<table class="kv">${rows.filter(Boolean).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("")}</table>`;
function loading() { $app.innerHTML = `<div class="empty">${t("loading")}</div>`; }
function fail(e) { $app.innerHTML = `<div class="err">${t("error")}: ${esc(e.message || e)}</div>`; }
let timer = null;
function every(ms, fn) { clearInterval(timer); timer = setInterval(() => { if (!document.hidden) fn().catch(() => {}); }, ms); }

// ---------- pages ----------
function meter(label, cur, need, fmt = num) {
  const pct = need > 0 ? Math.min(100, (cur / need) * 100) : 100;
  return `<div class="meter ${pct >= 100 ? "full" : ""}"><div class="t"><span>${label}</span><span>${fmt(cur)} / ${fmt(need)}</span></div><div class="b"><i style="width:${pct}%"></i></div></div>`;
}
function phaseCard(s) {
  const p = s.phase;
  const stakers = Number(s.stakers);
  const stakeBolt = Number(BigInt(s.totalStake) / WEI);
  const stage = s.stage;
  const cls = (st) => (st === stage ? "cur" : (stage === "pos" || (stage === "checkpoints" && st === "mining")) ? "done" : "");
  const tag = (st, sched) => st === stage ? `<span class="badge acc">${t("phase.now")}</span>` : cls(st) === "done" ? `<span class="badge ok">${t("phase.done")}</span>` : sched != null ? `<span class="badge warn">${t("phase.sched", { e: sched })}</span>` : "";
  const bolts = (v) => num(v) + " BOLT";
  const skipB = p.posEpoch != null && (p.checkpointEpoch == null || p.checkpointEpoch >= p.posEpoch);
  return `<div class="card phase"><h2>${t("phase.title")}</h2><div class="steps">
    <div class="step ${cls("mining")}"><h3>${t("phase.a")} ${tag("mining")}</h3><p>${t("phase.a.d")}</p></div>
    <div class="step ${cls("checkpoints")}"><h3>${t("phase.b")} ${tag("checkpoints", p.checkpointEpoch)}</h3><p>${t("phase.b.d")}</p>
      ${stage === "mining" && !skipB ? meter(t("phase.stakers"), stakers, p.checkpoint.stakers) + meter(t("phase.stake"), stakeBolt, p.checkpoint.stakeBolt, bolts) + meter(t("phase.streak"), p.checkpointStreak, p.streakRequired) : ""}</div>
    <div class="step ${cls("pos")}"><h3>${t("phase.c")} ${tag("pos", p.posEpoch)}</h3><p>${t("phase.c.d")}</p>
      ${stage !== "pos" ? meter(t("phase.stakers"), stakers, p.pos.stakers) + meter(t("phase.stake"), stakeBolt, p.pos.stakeBolt, bolts) + meter(t("phase.streak"), p.posStreak, p.streakRequired) : ""}</div>
  </div></div>`;
}
function blockRow(b) {
  return `<div class="row"><div class="ic">${b.mined ? "⛏" : "◆"}</div><div class="main"><div>${bLink(b.number)} <span class="muted">· ${ago(b.timestamp)}</span></div>
    <div class="muted">${b.mined ? t("mined.by") : t("produced.by")} ${aLink(b.miner)}${b.extra ? ` <span class="badge">${esc(b.extra)}</span>` : ""}</div></div>
    <div class="side"><span class="badge">${b.txs < 0 ? "—" : num(b.txs)} ${t("txs")}</span></div></div>`;
}
function txRow(x) {
  return `<div class="row"><div class="ic">Tx</div><div class="main"><div>${txLink(x.hash)} <span class="muted">· ${ago(x.timestamp)}</span></div>
    <div class="muted">${aLink(x.from)} → ${x.create ? `<span class="badge">${t("create")}</span>` : aLink(x.to, x.toLabel)}${x.method ? ` <span class="badge">${esc(x.method)}</span>` : ""}</div></div>
    <div class="side mono">${bolt(x.value, 3)}</div></div>`;
}
async function pageHome() {
  const draw = async () => {
    const [s, bl, tx] = await Promise.all([api("status"), api("blocks?limit=8"), api("txs?limit=8")]);
    document.getElementById("net").textContent = s.chainId === 8017 ? "Mainnet" : s.chainId === 8018 ? "Testnet" : "Chain " + s.chainId;
    const stats = [
      [t("stat.height"), num(s.head.number), `${t("stat.finalized")} ${num(s.finalized)}`],
      [t("stat.stage"), t("stage." + s.stage), `${t("epoch")} ${num(s.epoch)}`],
      [t("stat.blocktime"), s.blockTime ? s.blockTime.toFixed(1) + " " + t("s") : "—", `${t("stat.target")} ${s.targetBlockTime} ${t("s")}`],
      s.stage === "pos" ? [t("stat.validators"), num(s.validators), bolt(s.totalStake, 0) + " " + t("stat.staked")]
        : [t("stat.hashrate"), hashrate(s.hashrate), `${t("k.difficulty")} ${num(s.difficulty)}`],
      [t("stat.supply"), bolt(s.supply, 0), `${t("k.basefee")} ${gwei(s.baseFee)}`],
      s.stage === "pos" ? [t("peers"), num(s.peers), `${num(s.pending)} ${t("pendingtx")}`]
        : [t("stat.validators"), num(s.validators), bolt(s.totalStake, 0) + " " + t("stat.staked")],
    ];
    const keep = document.getElementById("hq");
    const typed = keep ? keep.value : "";
    $app.innerHTML = `<section class="hero">${MESH}<div class="in"><h1>${t("hero.title")}</h1><p>${t("hero.tag")}</p>
        <form id="hs"><input id="hq" autocomplete="off" spellcheck="false" placeholder="${esc(t("search.ph"))}"><button>${t("search.go")}</button></form></div></section>
      <div class="grid stats">${stats.map(([k, v, sub]) => `<div class="card stat"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${sub}</div></div>`).join("")}</div>
      ${phaseCard(s)}
      <div class="grid two" style="margin-top:16px">
        <div class="card"><div class="card-h"><h2>${t("latest.blocks")}</h2><a href="/blocks">${t("all")}</a></div><div class="list">${bl.blocks.map(blockRow).join("")}</div></div>
        <div class="card"><div class="card-h"><h2>${t("latest.txs")}</h2></div><div class="list">${tx.txs.length ? tx.txs.map(txRow).join("") : `<div class="empty">—</div>`}</div></div>
      </div>`;
    const hq = document.getElementById("hq");
    hq.value = typed;
    if (typed && keep === document.activeElement) hq.focus();
    document.getElementById("hs").onsubmit = (e) => { e.preventDefault(); doSearch(hq); };
  };
  await draw();
  every(6000, () => (document.activeElement && document.activeElement.id === "hq" ? Promise.resolve() : draw()));
}

  const first = d.blocks.length ? d.blocks[0].number : 0;
  $app.innerHTML = `<h1>${t("blocks")}</h1><div class="card scroll"><table class="tbl"><thead><tr>
    <th>${t("k.height")}</th><th>${t("k.time")}</th><th>${t("miner")}</th><th class="r">${t("k.txs")}</th><th class="r">${t("k.gas")}</th><th class="r">${t("k.difficulty")}</th></tr></thead><tbody>
    ${d.blocks.map((b) => `<tr><td>${bLink(b.number)}</td><td class="muted">${ago(b.timestamp)}</td><td>${aLink(b.miner)}${b.extra ? ` <span class="badge">${esc(b.extra)}</span>` : ""}</td><td class="r">${b.txs < 0 ? "—" : num(b.txs)}</td><td class="r">${num(b.gasUsed)}</td><td class="r">${b.mined ? num(b.difficulty) : "—"}</td></tr>`).join("")}
    </tbody></table><div class="pager">
    <button class="btn" ${first >= d.head ? "disabled" : ""} onclick="nav('/blocks?before=${first + 26}'">‹ ${t("prev")}</button>
    <button class="btn" ${last <= 0 ? "disabled" : ""} onclick="nav('/blocks?before=${last}'">${t("next")} ›</button></div></div>`;
}

async function pageTx(h) {
  const x = await api("tx/" + encodeURIComponent(h));

  const transfers = x.logs.filter((l) => l.transfer).map((l) => l.transfer);
  $app.innerHTML = `<h1>${t("tx")} ${txStatus(x)} ${x.final === false && !x.pending ? `<span class="badge warn">${t("final.no")}</span>` : ""}</h1>
    <div class="card">${kv([
      [t("k.hash"), `<span class="mono break">${x.hash}</span>${copyBtn(x.hash)}`],
      !x.pending && [t("k.block"), `${bLink(x.block)} <span class="muted">· ${ago(x.timestamp)} (${dateOf(x.timestamp)})</span>`],
      [t("k.from"), aLink(x.from, x.from) + copyBtn(x.from)],
      [t("k.to"), x.to ? aLink(x.to, x.toLabel ? `${x.toLabel} (${short(x.to)})` : x.to) + copyBtn(x.to) : `<span class="badge">${t("create")}</span>`],
      x.created && [t("k.created"), aLink(x.created, x.created)],
      [t("k.value"), bolt(x.value, 18)],

      transfers.length && [t("k.transfers"), transfers.map((tr) => `<div>${aLink(tr.from, tr.fromLabel)} → ${aLink(tr.to, tr.toLabel)} · <span class="mono">${tr.amount ?? "#" + tr.tokenId}</span> <span class="muted">(${aLink(tr.token, tr.tokenLabel)})</span></div>`).join("")],
      x.fee && [t("k.fee"), `${bolt(x.fee, 8)} <span class="muted">(${t("k.burned")} ${bolt(x.burned, 8)})</span>`],
      x.gasPrice && [t("k.gasprice"), gwei(x.gasPrice)],
      [t("k.gas"), x.gasUsed != null ? `${num(x.gasUsed)} / ${num(x.gasLimit)}` : num(x.gasLimit)],
      [t("k.nonce"), num(x.nonce)],
      [t("k.type"), "EIP-2718 type " + x.type],
      x.input && x.input !== "0x" && [t("k.input"), `<div class="mono break" style="max-height:160px;overflow:auto;background:var(--code);padding:8px;border-radius:8px">${esc(x.input)}</div>`],
      x.logs.length && [t("k.logs"), x.logs.map((l, i) => `<div style="margin-bottom:8px"><span class="badge">${i}</span> ${aLink(l.address, l.label)}<div class="mono break muted">${l.topics.map(esc).join("<br>")}</div></div>`).join("")],
    ])}</div>`;
}
function fmtParam(p) {
  const v = p.value;
  if (typeof v === "string" && /^0x[0-9a-fA-F]{40}$/.test(v)) return aLink(v, v);
  if (p.name === "id") return `<a href="/validator/${v}">${esc(v)}</a>`;
  if (p.name === "amount") return esc(v);
  return esc(typeof v === "string" ? v : JSON.stringify(v));
}

const cstate = { files: [], public: false, quote: null, status: "", busy: false, channel: null, prepared: null, sdk: null };
const bytesFmt = (n) => (n < 1024 ? `${n} B` : n < 1 << 20 ? `${(n / 1024).toFixed(1)} KB` : n < 1 << 30 ? `${(n / 1048576).toFixed(1)} MB` : `${(n / 1073741824).toFixed(2)} GB`);
const boltFmt = (w) => bolt(w, 4).replace(" BOLT", "");
const dayOf = (ts) => new Date(ts * 1000).toLocaleDateString(lang === "zh" ? "zh-TW" : "en-US", { year: "numeric", month: "long", day: "numeric" });

async function certConfig() {

function loadSdk(wallet) {

/// A rosette seal. `ok` null = pending, true = verified, false = failed.
function seal(code, date, ok) {
  const id = "s" + Math.random().toString(36).slice(2, 8);
  const c1 = ok === false ? "#c9443c" : ok === null ? "#8b9ab0" : "#2f6fcf";
  const c2 = ok === false ? "#ff8a80" : ok === null ? "#c0cad6" : "#6cc3bb";
  const pts = [];
  for (let i = 0; i < 48; i++) {
    const a = (i / 48) * Math.PI * 2, r = i % 2 ? 91 : 99;
    pts.push(`${(100 + r * Math.cos(a)).toFixed(1)},${(100 + r * Math.sin(a)).toFixed(1)}`);
  }
  const bottom = t("ct.seal");
  const cjk = /[^\x00-\x7f]/.test(bottom);
  return `<svg class="seal" viewBox="0 0 200 200" role="img" aria-label="${esc(bottom)} ${esc(code)}">
    <defs><linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>
      <path id="${id}t" d="M 28,100 A 72,72 0 0,1 172,100"/><path id="${id}b" d="M 28,100 A 72,72 0 0,0 172,100"/></defs>
    <polygon points="${pts.join(" ")}" fill="url(#${id}g)"/>
    <circle cx="100" cy="100" r="85" fill="none" stroke="#fff" stroke-opacity=".8" stroke-width="1.4"/>
    <circle cx="100" cy="100" r="58" fill="#fff" fill-opacity=".13" stroke="#fff" stroke-opacity=".8" stroke-width="1.2"/>
    <g fill="#fff" font-weight="700" font-family="-apple-system,'Segoe UI','PingFang TC','Noto Sans TC',sans-serif" dominant-baseline="middle">
      <text font-size="13" letter-spacing="3"><textPath href="#${id}t" startOffset="50%" text-anchor="middle">BOLTCHAIN</textPath></text>
      <text font-size="${cjk ? 13 : 10.5}" letter-spacing="${cjk ? 5 : 1.5}"><textPath href="#${id}b" startOffset="50%" text-anchor="middle">${esc(bottom)}</textPath></text>
      <circle cx="28" cy="100" r="2.6"/>${ok === null ? `<circle cx="172" cy="100" r="2.6"/>` : ""}
    </g>
    <path d="M106 58 L85 101 H100 L94 130 L119 88 H103 L112 58 Z" fill="#fff"/>
    <text x="100" y="146" text-anchor="middle" font-size="9.5" font-weight="700" fill="#fff" font-family="ui-monospace,Menlo,monospace">${esc(date || "")}</text>
    ${ok === null ? "" : `<g transform="translate(176,100)"><circle r="15" fill="#fff" stroke="${c1}" stroke-width="2"/><path d="${ok ? "M-7 0 L-2 6 L8 -6" : "M-6 -6 L6 6 M6 -6 L-6 6"}" stroke="${c1}" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`}
  </svg>`;
}

function renderNew(cfg) {
  const box = document.getElementById("cnew");
  if (!box) return;
  const total = cstate.files.reduce((a, f) => a + f.file.size, 0);
  const q = cstate.quote;
  const secure = window.isSecureContext;
  const ready = cstate.files.length && cstate.files.every((f) => f.hashes) && q && !q.error;
  const payLabel = cstate.prepared ? t("cv.confirm", { fee: boltFmt(cstate.prepared.quote.cost) }) : t("cv.pay");
  box.innerHTML = `
    <label class="bigdrop" id="cdrop"><input type="file" id="cfiles" multiple>${t("cv.drop")} <b>${t("cv.pick")}</b></label>
    ${cstate.files.length ? `<div class="flist">${cstate.files.map((f, i) => `<div class="f"><span>${esc(f.file.name)}</span><span class="muted">${bytesFmt(f.file.size)} ${f.hashes ? "" : "…"}</span><button data-rm="${i}" title="✕" ${cstate.busy ? "disabled" : ""}>✕</button></div>`).join("")}<div class="hint">${t("cv.files", { n: cstate.files.length, size: bytesFmt(total) })}</div></div>` : ""}
    <label class="switch"><span class="tg"><input type="checkbox" role="switch" id="cpub" ${cstate.public ? "checked" : ""} ${cstate.busy ? "disabled" : ""}><i></i></span><span>${t("cv.public")}<br><span class="hint">${t("cv.public.h")}</span></span></label>
    ${q ? `<div class="hint">${q.error ? esc(q.error) : t("cv.fee", { fee: `<b>${boltFmt(q.cost)}</b>`, n: q.replicas, until: dayOf(q.until) })}</div>` : ""}
    ${secure ? "" : `<div class="note">${t("cv.https", { url: `<a href="https://boltchain.cafeca.io/verify">https://boltchain.cafeca.io</a>` })}</div>`}
    <div><button class="btn acc lg" id="cpay" ${ready && secure && !(cstate.busy && !cstate.prepared) ? "" : "disabled"}>${payLabel}</button></div>
    <div class="cv-status" id="cst">${esc(cstate.status)}</div>`;
  const inp = document.getElementById("cfiles"), drop = document.getElementById("cdrop");
  inp.onchange = () => addFiles([...inp.files], cfg);
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove("over"); addFiles([...e.dataTransfer.files], cfg); };
  box.querySelectorAll("[data-rm]").forEach((b) => (b.onclick = (e) => { e.preventDefault(); cstate.files.splice(Number(b.dataset.rm), 1); resetPrepared(); requote(cfg); }));
  document.getElementById("cpub").onchange = (e) => { cstate.public = e.target.checked; resetPrepared(); requote(cfg); };
  document.getElementById("cpay").onclick = () => (cstate.prepared ? pay(cfg) : start(cfg));
}
const setStatus = (msg, cfg) => { cstate.status = msg; const el = document.getElementById("cst"); if (el) el.textContent = msg; else if (cfg) renderNew(cfg); };
function resetPrepared() { cstate.prepared = null; }
async function addFiles(list, cfg) {
  if (cstate.busy) return;
  for (const file of list) cstate.files.push({ file, hashes: null });
  cstate.files = cstate.files.slice(0, 256);
  resetPrepared();
  renderNew(cfg);
  for (const f of cstate.files) {
    if (!f.hashes) { f.hashes = await V.hashFile(f.file, null, VERIFY_URL); renderNew(cfg); }
  }
  requote(cfg);
}
// Size of the storage deal: the manifest (about 200 bytes a file), plus the files when public.
const dealSize = () => 1024 + cstate.files.length * 400 + (cstate.public ? cstate.files.reduce((a, f) => a + f.file.size, 0) : 0);
async function requote(cfg) {
  if (!cstate.files.length) { cstate.quote = null; renderNew(cfg); return; }
  try { cstate.quote = await api(`storage/quote?size=${dealSize()}`); }
  catch (e) { cstate.quote = { error: /offers space|503/.test(e.message) ? t("cv.fee.none") : e.message }; }
  renderNew(cfg);
}
async function getChannel(cfg) {
  const C = await loadSdk(cfg.wallet);
  const cafeca = C.create({ wallet: cfg.wallet });
  let id = null;
  try { id = localStorage.getItem("cafeca.channel"); } catch (_) {}
  if (id) { const ch = await cafeca.restoreChannel(id).catch(() => null); if (ch) return ch; }
  return null;
}
/// First click: sign in to CAFECA (popup, must start inside the click), then prepare the deal.
function start(cfg) {
  if (cstate.busy) return;
  cstate.busy = true;
  const C = window.CafecaConnect;
  let signing = null;
  if (C && !cstate.channel) {
    const cafeca = C.create({ wallet: cfg.wallet });
    setStatus(t("cv.s.signin"));
    const nonce = V.toHex(crypto.getRandomValues(new Uint8Array(16))).slice(2);
    signing = cafeca.signIn({ nonce, statement: t("cv.new"), channel: { ttl: 30 * 86400 } })
      .then((resp) => cafeca.channel(resp)).then((ch) => { if (!ch) throw new Error("CAFECA channel"); try { localStorage.setItem("cafeca.channel", ch.id); } catch (_) {} return ch; });
  } else if (!C) {
    signing = Promise.reject(new Error("cannot load the CAFECA SDK"));
  }
  (async () => {
    try {
      if (signing) cstate.channel = await signing;
      cstate.prepared = await prepare(cfg, cstate.channel.account);
      setStatus(t("cv.s.ready", { acct: short(cstate.channel.account, 8, 6) }));
    } catch (e) {
      setStatus(t("cv.s.fail", { e: e.message || e }));
    } finally { cstate.busy = false; renderNew(cfg); }
  })();
}
/// Uploads the manifest (and the files when public), builds the deal index and the call data.
async function prepare(cfg, account) {
  const files = cstate.files.map((f) => f.hashes);
  let chunks = null;
  const blocks = [];
  if (cstate.public) {
    chunks = [];
    const total = cstate.files.reduce((a, f) => a + f.file.size, 0) || 1;
    let sent = 0, batch = [], batchBytes = 0;
    const flush = async () => {
      if (!batch.length) return;
      const got = await fetch("/api/upload", { method: "POST", body: V.uploadBody(batch.map((b) => b.data)) }).then((r) => r.json());
      if (got.error) throw new Error(got.error);
      batch.forEach((b, i) => { if (got.cids[i] !== b.cid) throw new Error("the node stored a different block"); });
      batch = []; batchBytes = 0;
    };
    for (const f of cstate.files) {
      chunks.push(await V.chunkFile(f.file, async (c) => {
        blocks.push(c.cid);
        batch.push(c); batchBytes += c.data.length; sent += c.data.length;
        if (batchBytes >= 6 << 20) await flush();
        setStatus(t("cv.s.upload", { p: Math.round((sent / total) * 100) }));
      }));
    }
    await flush();
  }
  setStatus(t("cv.s.prepare"));
  const salt = V.toHex(crypto.getRandomValues(new Uint8Array(32)));
  const manifest = V.certManifest(files, chunks, salt);
  const mcid = V.rawCid(manifest);
  const up = await fetch("/api/upload", { method: "POST", body: V.uploadBody([manifest]) }).then((r) => r.json());
  if (up.error || up.cids[0] !== mcid) throw new Error(up.error || "manifest upload");
  const idx = await fetch("/api/deal-index", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ entry: mcid, blocks: [mcid, ...blocks] }) }).then((r) => r.json());
  if (idx.error) throw new Error(idx.error);
  const quote = await api(`storage/quote?size=${idx.size}`);
  const root = V.certTree(files).root;
  const code = V.certCode(root, account, salt);
  const data = V.issueCalldata({ salt, files, publicFiles: cstate.public, manifest: V.toHex(V.cidBytes(mcid)), dealRoot: idx.rootBytes, blocks: idx.blocks, size: idx.size, replicas: quote.replicas, epochs: quote.epochs, price: quote.price });
  return { code, data, quote, count: files.length };
}
/// Second click: pay through the CAFECA channel (popup inside the click), then wait for the block.
function pay(cfg) {
  if (cstate.busy) return;
  cstate.busy = true;
  const p = cstate.prepared;
  setStatus(t("cv.s.pay"));
  const desc = { title: lang === "zh" ? "建立 Boltchain 存證證書" : "Create a Boltchain certificate", detail: `${p.count} ${lang === "zh" ? "個檔案" : "file(s)"} · ${V.formatCode(V.encodeCode(p.code))} · ${boltFmt(p.quote.cost)} BOLT${cstate.public ? (lang === "zh" ? " · 公開原始檔案" : " · public files") : ""}` };
  cstate.channel.sendCalls([{ to: cfg.contract, value: p.quote.cost, data: p.data }], desc)
    .then(async (r) => {
      if (r && r.success === false) throw new Error("reverted");
      setStatus(t("cv.s.wait"));
      const code = V.formatCode(V.encodeCode(p.code));
      for (let i = 0; i < 60; i++) {
        try { await api(`cert/${code}`); cstate.files = []; cstate.prepared = null; cstate.quote = null; cstate.status = ""; cstate.busy = false; nav(`/cert/${code}`); return; } catch (_) {}
        await new Promise((res) => setTimeout(res, 2000));
      }
      throw new Error("timeout");
    })
    .catch((e) => { cstate.busy = false; if (e && e.code === "channel_closed") { cstate.channel = null; cstate.prepared = null; try { localStorage.removeItem("cafeca.channel"); } catch (_) {} } setStatus(t("cv.s.fail", { e: (e && e.message) || e })); renderNew(cfg); });
}

      <div style="margin-top:12px"><a href="/verify">← ${t("cv.back")}</a></div>`;

  const files = L.files.map((f, i) => `<div class="row"><span class="badge">${i + 1}</span><span class="n mono">${bytesFmt(f.size)} · sha-256 ${short(f.sha256, 10, 8)}</span>${c.public ? `<button class="btn" data-dl="${i}">${t("ct.dl.btn")}</button>` : ""}</div>`).join("");
  $app.innerHTML = `
    <div class="card cert">
      <div class="cert-top">
        <div style="min-width:0"><div class="sub">${t("ct.sub")}</div><h1>${t("ct.title")}</h1><div class="cert-code">${code}${copyBtn(code)}</div><div>${state}</div></div>
        ${seal(code, new Date(Number(c.issuedAt) * 1000).toISOString().slice(0, 10), L.ok)}
      </div>
      <div style="margin-top:16px;position:relative">${kv([
        [t("ct.issued"), esc(new Date(Number(c.issuedAt) * 1000).toLocaleString(lang === "zh" ? "zh-TW" : "en-US"))],
        [t("ct.block"), `${bLink(c.block)} <span class="mono muted">${esc(short(L.blockHash || "", 10, 8))}</span>`],
        [t("ct.issuer"), aLink(c.issuer, c.issuer)],
        [t("ct.files"), String(c.files)],
        [t("ct.public"), c.public ? t("ct.public.y") : t("ct.public.n")],
        [t("ct.keep"), esc(keep)],

/// A file extension from the first bytes (names are never recorded).
function sniffExt(h) {
  const x = Array.from(h, (b) => b.toString(16).padStart(2, "0")).join("");
  if (x.startsWith("25504446")) return ".pdf";
  if (x.startsWith("89504e47")) return ".png";
  if (x.startsWith("ffd8ff")) return ".jpg";
  if (x.startsWith("47494638")) return ".gif";
  if (x.startsWith("504b0304")) return ".zip";
  if (x.startsWith("7b") || x.startsWith("5b")) return ".json";
  return ".bin";
}

function mesh(w, h, n, seed) {
  // Deterministic network mesh in two diagonal bands (the brand's background motif).
  let x = seed; const rnd = () => ((x = (x * 1103515245 + 12345) % 2147483648) / 2147483648);
  const pts = [];
  for (let i = 0; i < n; i++) {
    const u = rnd() * w; const band = i % 2 ? 0.18 : 0.78;
    const v = (band + (rnd() - 0.5) * 0.42) * h + (u / w - 0.5) * h * (i % 2 ? 0.5 : -0.5);
    pts.push([u, v, 1 + rnd() * 2.2]);
  }
  let lines = "";
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
    const dx = pts[i][0] - pts[j][0], dy = pts[i][1] - pts[j][1];
    if (dx * dx + dy * dy < 95 * 95) lines += `<line x1="${pts[i][0].toFixed(1)}" y1="${pts[i][1].toFixed(1)}" x2="${pts[j][0].toFixed(1)}" y2="${pts[j][1].toFixed(1)}"/>`;
  }
  const dots = pts.map(([a, b, r]) => `<circle cx="${a.toFixed(1)}" cy="${b.toFixed(1)}" r="${r.toFixed(1)}"/>`).join("");
  return `<svg class="mesh" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g stroke="#3f6f86" stroke-width=".7" opacity=".7">${lines}</g><g fill="#7fd0c8">${dots}</g></svg>`;
}

async function postJob(cfg, d) {
  if (jstate.busy) return;
  jstate.busy = true;

  const val = (id) => document.getElementById(id).value.trim();
  try {
    if (!C) throw new Error("cannot load the CAFECA SDK");

    if (!jstate.channel) {
      jsetStatus(t("cv.s.signin"));

      const nonce = V.toHex(crypto.getRandomValues(new Uint8Array(16))).slice(2);
      const resp = await cafeca.signIn({ nonce, statement: tr("發出 AI 推論工作", "Post an AI inference job"), channel: { ttl: 30 * 86400 } });
      jstate.channel = await cafeca.channel(resp);

    }
    const acct = jstate.channel.account;
    const vm = await vault();
    let sk = keyStore.get(acct);
    if (!sk) { const kp = vm.generateKeyPair(); sk = kp.secretKey; keyStore.set(acct, sk); }
    const pk = vm.publicKeyOf(sk);
    const provider = val("jprov");
    const prov = d.providers.find((p) => p.address.toLowerCase() === provider.toLowerCase());
    jsetStatus(tr("在瀏覽器內加密…", "Encrypting in the browser…"));
    const body = JSON.stringify({ messages: [{ role: "user", content: val("jprompt") }], max_tokens: Number(val("jmout")) });
    const sealed = vm.seal(V.utf8(body), "input.json", "application/json", [pk, V.fromHex(prov.encKey)]);
    const blocks = [sealed.envelope, sealed.manifest, ...sealed.shards];
    const host = await fetch("/api/compute/host", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ root: sealed.envelope.cid, blocks: blocks.map((b) => [b.cid, V.toHex(b.bytes).slice(2)]) }) }).then((r) => r.json());
    if (host.error) throw new Error(host.error);
    const wei = (s) => { const [i, f = ""] = s.split("."); return BigInt(i || "0") * 10n ** 18n + BigInt((f + "0".repeat(18)).slice(0, 18)); };
    const pin = wei(val("jpin")), pout = wei(val("jpout")), maxIn = BigInt(val("jmin")), maxOut = BigInt(val("jmout"));
    const value = (maxIn * pin) / 1000n + (maxOut * pout) / 1000n;

    const mine = V.toHex(pk);

      calls.push({ to: d.contract, value: "0", data: enc("setEncryptionKey(bytes32)", [mine]) });
    }
    calls.push({ to: d.contract, value: value.toString(), data: enc("post(address,uint64,bytes,uint128,uint128,uint64,uint64,uint64,uint64,uint128)", [provider, BigInt(val("jmodel")), V.toHex(V.cidBytes(sealed.envelope.cid)), pin, pout, maxIn, maxOut, now + 3600n, 86400n, 0n]) });
    jsetStatus(t("cv.s.pay"));
    const r = await jstate.channel.sendCalls(calls, { title: tr("發出 AI 推論工作", "Post an AI inference job"), detail: `${tr("模型", "model")} ${val("jmodel")} · ${tr("託管", "escrow")} ${boltFmt(value)} BOLT` });
    if (r && r.success === false) throw new Error("reverted");
    jsetStatus(tr("已送出，等待上鏈…", "Sent; waiting for the block…"));
    for (let i = 0; i < 60; i++) {
      const c = await api(`compute?requester=${acct}&limit=1`).catch(() => null);

/// Fetches and opens a bolt-vault file named by `cid` with this browser's key for `acct`.
async function openSealed(cid, acct) {
  const sk = keyStore.get(acct);
  if (!sk) throw new Error(tr("此瀏覽器沒有這個帳戶的解密金鑰", "This browser holds no decryption key for this account"));
  const vm = await vault();
  const get = async (cids) => { const r = await api(`compute/blocks?cids=${cids.join(",")}&root=${cid}`); return r.blocks.map((h) => V.fromHex("0x" + h)); };
  const [env] = await get([cid]);
  const o = vm.openEnvelope(env, sk);
  const [man] = await get([o.manifestCid]);
  const m = vm.openManifest(env, man, o.contentKey);
  const shards = [];
  for (let i = 0; i < m.shards.length; i += 64) shards.push(...(await get(m.shards.slice(i, i + 64))));
  return new TextDecoder().decode(vm.recover(m.json, o.contentKey, shards));
}

    ])}</div>
    ${j.output ? `<div class="card" style="margin-top:16px"><div class="card-h"><h2>${tr("結果", "Result")}</h2><button class="btn" id="jread">${tr("在瀏覽器內解密", "Decrypt in this browser")}</button></div><div class="cv-body" id="jout"><div class="muted">${tr("只有發出者（用發出時的同一個瀏覽器）讀得到。", "Only the requester can read it (in the browser it posted from).")}</div></div></div>` : ""}`;
  const b = document.getElementById("jread");
  if (b) b.onclick = async () => {
    const out = document.getElementById("jout");
    out.textContent = t("loading");
    try {
      const txt = await openSealed(j.output, j.requester);
      let content = txt;
      try { const r = JSON.parse(txt); content = r.choices[0].message.content; } catch (_) {}
      out.innerHTML = `<pre style="white-space:pre-wrap">${esc(content)}</pre>`;
    } catch (e) { out.innerHTML = `<div class="err">${esc(e.message || e)}</div>`; }
  };
}

async function pageTee() {
  const d = await api("tee");
  if (!d.enabled) { $app.innerHTML = `<div class="empty">${tr("此鏈尚未啟用 TEE 租用", "TEE leasing is not active on this chain")}</div>`; return; }
  const sim = d.collateral.root === "simulated";
  $app.innerHTML = `<h1>${tr("TEE Agent 租用", "TEE agent leases")} <span class="badge">${num(d.leaseCount)} ${tr("份租約", "leases")}</span>${d.pendingAttestations ? ` <span class="badge warn">${d.pendingAttestations} ${tr("件證明待驗證小組審核", "attestations awaiting the panel")}</span>` : ""}</h1>
    <p class="muted">${tr("執行者出租已證明的機密運算環境（Intel TDX 鏈上驗證；TPM 量測開機由驗證小組背書），Agent 在裡面運行並每小時上鏈檢查點。", "Operators rent out attested confidential machines (Intel TDX verified on chain; TPM measured boot endorsed by the verifier panel); agents run inside and checkpoint on chain every hour.")}</p>
    <div class="card" style="margin-bottom:16px">${kv([
      [tr("信任根", "Trust anchor"), sim ? `<span class="badge warn">${tr("模擬 PKI（開發鏈）", "simulated PKI (development chain)")}</span>` : "Intel SGX Root CA"],
      [tr("TD 報價飛地身分", "TD quoting enclave identity"), d.collateral.qeEvaluation ? `${tr("評估編號", "evaluation")} ${d.collateral.qeEvaluation} · ${tr("下次更新", "next update")} ${dateOf(d.collateral.qeNextUpdate)}` : `<span class="badge warn">${tr("尚未提交", "not submitted")}</span>`],
      Number(d.burned) > 0 && [tr("已罰沒銷毀", "Slashed and burned"), bolt(d.burned, 4)],
    ])}</div>
    <div class="card" style="margin-bottom:16px"><div class="card-h"><h2>${tr("機器", "Machines")}</h2></div>
      ${d.machines.length ? `<div class="scroll"><table class="tbl"><thead><tr><th>#</th><th>${tr("類型", "Kind")}</th><th>${tr("規格", "Spec")}</th><th class="r">${tr("每小時", "Per hour")}</th><th class="r">${tr("押金", "Bond")}</th><th>${tr("狀態", "Status")}</th></tr></thead><tbody>
      ${d.machines.map((m) => `<tr><td><a href="/machine/${m.id}">${m.id}</a></td><td>${kindName(m.kind)}</td><td>${m.cpus} ${tr("核", "cores")} · ${m.memGiB} GiB${m.gpu ? " · " + esc(m.gpu) : ""}</td><td class="r mono">${m.pricePerHour !== "0" ? bolt(m.pricePerHour, 3) : "—"}</td><td class="r mono">${bolt(m.bond, 2)}</td><td>${machineBadge(m)}</td></tr>`).join("")}
      </tbody></table></div>` : `<div class="empty">${tr("尚無機器", "No machines yet")}</div>`}</div>
    <div class="card" style="margin-bottom:16px"><div class="card-h"><h2>${tr("最近的租約", "Recent leases")}</h2></div>${leasesTable(d.leases)}</div>
    <div class="card"><div class="card-h"><h2>${tr("Runtime 映像", "Runtime images")}</h2></div>
      ${d.images.length ? d.images.map((i) => `<div style="padding:10px 14px;border-top:1px solid var(--line)"><b>#${i.id} ${esc(i.name)}</b> <span class="muted">${tr("原始碼", "source")} ${esc(i.source)} · ${tr("登記者", "by")} ${aLink(i.registrant)}</span>${i.build ? `<div class="hint mono">${esc(i.build)}</div>` : ""}
        ${i.measurements.map((m) => `<div class="hint"><span class="badge">${m.kind.toUpperCase()}</span> <span class="mono">${esc(short(m.hash, 12, 8))}</span> ${esc(m.platform)} · ${tr("獨立重現", "reproduced by")} ${m.reproductions}</div>`).join("")}</div>`).join("") : `<div class="empty">${tr("尚無映像", "No images yet")}</div>`}</div>`;
}
function machineBadge(m) {
  if (m.blacklisted) return `<span class="badge bad">${tr("黑名單", "blacklisted")}</span>`;
  if (!m.verified) return `<span class="badge warn">${tr("等待驗證小組", "awaiting the panel")}</span>`;
  const tcb = m.kind === "tdx" ? ` <span class="badge ${m.tcbStatus === 1 ? "ok" : "warn"}">${tcbName(m.tcbStatus)}</span>` : "";
  return (m.available ? `<span class="badge ok">${tr("出租中", "on offer")}</span>` : `<span class="badge">${tr("暫停", "paused")}</span>`) + tcb;
}
function leasesTable(ls) {
  return ls.length ? `<div class="scroll"><table class="tbl"><thead><tr><th>#</th><th>${tr("狀態", "State")}</th><th>${tr("機器", "Machine")}</th><th>${tr("租用者", "Renter")}</th><th class="r">${tr("檢查點版本", "Checkpoint")}</th><th class="r">${tr("已付時數", "Hours paid")}</th><th class="r">${tr("託管餘額", "Escrow left")}</th></tr></thead><tbody>
    ${ls.map((l) => `<tr><td><a href="/lease/${l.id}">${l.id}</a></td><td>${leaseBadge(l)}</td><td><a href="/machine/${l.machine}">${l.machine}</a></td><td>${aLink(l.renter)}</td><td class="r">${l.version}</td><td class="r">${l.hoursPaid}</td><td class="r mono">${bolt(l.escrow, 3)}</td></tr>`).join("")}
    </tbody></table></div>` : `<div class="empty">${tr("尚無租約", "No leases yet")}</div>`;
}
async function pageLease(id) {
  const l = await api("tee/lease/" + encodeURIComponent(id));
  const zero = "0x0000000000000000000000000000000000000000";
  $app.innerHTML = `<h1>${tr("租約", "Lease")} #${l.id} ${leaseBadge(l)}</h1>
    <div class="card">${kv([
      [tr("機器", "Machine"), `<a href="/machine/${l.machine}">#${l.machine}</a> · ${kindName(l.machineInfo.kind)} · ${aLink(l.machineInfo.operator)}`],
      [tr("租用者", "Renter"), aLink(l.renter, l.renter)],
      [tr("映像 / Agent 包", "Image / agent package"), `#${l.image} · <span class="mono">${esc(short(l.agentHash, 12, 8))}</span>`],
      [tr("價格", "Price"), `${bolt(l.pricePerHour, 4)} / ${tr("小時", "hour")} · ${tr("已付", "paid")} ${l.hoursPaid} h · ${tr("託管餘額", "escrow left")} ${bolt(l.escrow, 4)}`],
      [tr("要求", "Requires"), `TCB ≤ ${tcbName(l.minTcb)} · ${tr("押金", "bond")} ≥ ${bolt(l.minBond, 2)}`],
      l.signer !== zero && [tr("現役 enclave 金鑰", "Active enclave key"), `<span class="mono break">${esc(l.signer)}</span>`],
      l.signer !== zero && [tr("加密金鑰", "Encryption key"), `<span class="mono break">${esc(l.encKey)}</span>`],
      l.activatedAt && [tr("啟用時間", "Activated"), dateOf(l.activatedAt)],
      [tr("最新檢查點", "Latest checkpoint"), l.version ? `v${l.version} · ${ago(l.lastCheckpointAt)} · <span class="mono">${esc(short(l.stateRoot, 10, 8))}</span>` : "—"],
      l.stateCid && [tr("狀態 CID", "State CID"), `<span class="mono break">${esc(l.stateCid)}</span>`],
      l.exitAt && [tr("執行者退出", "Operator leaves"), dateOf(l.exitAt)],
    ])}</div>
    <div class="hint" style="margin-top:10px">${tr("交付秘密前請先在本機驗證：", "Verify locally before handing over secrets: ")}<code>boltchain lease verify ${l.id}</code></div>`;
}
async function pageMachine(id) {
  const m = await api("tee/machine/" + encodeURIComponent(id));
  $app.innerHTML = `<h1>${tr("機器", "Machine")} #${m.id} ${machineBadge(m)}</h1>
    <div class="card">${kv([
      [tr("類型", "Kind"), kindName(m.kind)],
      [tr("機器 ID（公開）", "Machine ID (public)"), `<span class="mono break">${esc(m.machineId)}</span>`],
      [tr("執行者", "Operator"), `${aLink(m.operator, m.operator)} · ${tr("押金", "bond")} ${bolt(m.bond, 4)}${m.slashedAt ? ` <span class="badge bad">${tr("已罰沒", "slashed")}</span>` : ""}`],
      [tr("規格", "Spec"), `${m.cpus} ${tr("核", "cores")} · ${m.memGiB} GiB${m.gpu ? " · " + esc(m.gpu) : ""}`],
      [tr("每小時價格", "Price per hour"), m.pricePerHour !== "0" ? bolt(m.pricePerHour, 4) : "—"],
      [tr("端點", "Endpoint"), `<span class="mono">${esc(m.endpoint)}</span>`],
      [tr("登記時間", "Registered"), dateOf(m.registeredAt)],
    ])}</div>
    <div class="card" style="margin-top:16px"><div class="card-h"><h2>${tr("租約", "Leases")}</h2></div>${leasesTable(m.leaseList)}</div>`;
}
// Clean URLs (/block/12, /tx/0x…): the server answers every page path with this file.
const PAGES = new Set(["blocks", "block", "tx", "address", "validators", "validator", "epoch", "verify", "cert", "compute", "job", "tee", "lease", "machine"]);
function nav(url) {
  history.pushState(null, "", url);
  route();
}
async function route() {
  clearInterval(timer);
  const [page, arg] = location.pathname.replace(/^\/+/, "").split("/").map(decodeURIComponent);
  const q = new URLSearchParams(location.search);
  document.querySelectorAll("[data-nav]").forEach((a) => a.classList.toggle("on", a.dataset.nav === (page === "cert" ? "verify" : page === "job" ? "compute" : page === "lease" || page === "machine" ? "tee" : PAGES.has(page) ? page : "home")));
  document.body.classList.toggle("home", !PAGES.has(page));
  loading();
  try {
    if (page === "blocks") await pageBlocks(q);
    else if (page === "block") await pageBlock(arg);
    else if (page === "tx") await pageTx(arg);
    else if (page === "address") await pageAddress(arg, q);
    else if (page === "validators") await pageValidators();
    else if (page === "validator") await pageValidator(arg);
    else if (page === "epoch") await pageEpoch(arg);
    else if (page === "verify") q.get("mode") === "proof" ? pageVerify() : await pageRecords();
    else if (page === "cert") await pageCert(arg);
    else if (page === "compute") await pageCompute();
    else if (page === "job") await pageJob(arg);
    else if (page === "tee") await pageTee();
    else if (page === "lease") await pageLease(arg);
    else if (page === "machine") await pageMachine(arg);
    else await pageHome();
    window.scrollTo(0, 0);
  } catch (e) { fail(e); }
}
// Links inside the explorer navigate without reloading; /ipfs/… and new-tab clicks go to the browser.
document.addEventListener("click", (e) => {
  const a = e.target.closest("a[href]");
  if (!a || a.target || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  const u = new URL(a.href, location.href);
  const page = u.pathname.split("/")[1];
  if (u.origin !== location.origin || (u.pathname !== "/" && !PAGES.has(page))) return;
  e.preventDefault();
  if (u.pathname + u.search !== location.pathname + location.search) nav(u.pathname + u.search);
});
window.addEventListener("popstate", route);
// Old links (/#/block/12) still work: rewrite them to the clean URL.
if (location.hash.startsWith("#/")) history.replaceState(null, "", location.hash.slice(1) || "/");
applyTheme();
applyI18n();
route();
api("status").then((s) => { document.getElementById("net").textContent = s.chainId === 8017 ? "Mainnet" : s.chainId === 8018 ? "Testnet" : "Chain " + s.chainId; }).catch(() => {});
</script>
</body>
</html>
